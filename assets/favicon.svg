<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16000a"/>
      <stop offset="55%" stop-color="#63000d"/>
      <stop offset="100%" stop-color="#240014"/>
    </linearGradient>

    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d9a0b0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect
    width="512"
    height="512"
    rx="120"
    fill="url(#bg)"
  />

  <rect
    x="28"
    y="28"
    width="456"
    height="456"
    rx="100"
    fill="none"
    stroke="#ffffff"
    stroke-width="3"
    opacity="0.12"
  />

  <!-- Terminal prompt -->
  <text
    x="256"
    y="305"
    text-anchor="middle"
    font-family="monospace"
    font-size="190"
    font-weight="700"
    fill="url(#text)"
    filter="url(#glow)"
  >
    &gt;_
  </text>

  <!-- MAHEEM -->
  <text
    x="256"
    y="390"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="42"
    font-weight="700"
    letter-spacing="8"
    fill="#ffffff"
  >
    M
  </text>

  <circle
    cx="256"
    cy="256"
    r="205"
    fill="none"
    stroke="#ffffff"
    stroke-width="2"
    opacity="0.08"
  />
</svg>
